# Compila Jaguar Code para Linux (no se puede desde un Mac) y lo adjunta a la
# publicación (release) de GitHub. También se puede lanzar a mano desde la
# pestaña Actions para probar el paquete.
name: Escritorio

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Compilar
        working-directory: apps/jaguar
        run: flutter build linux --release
      - name: Empaquetar
        working-directory: apps/jaguar
        run: |
          paquete=JaguarCode
          mkdir "$paquete"
          cp -R build/linux/x64/release/bundle/. "$paquete/"
          cp linux/paquete/* "$paquete/"
          tar -czf JaguarCode-linux-x64.tar.gz "$paquete"
          sha256sum JaguarCode-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: JaguarCode-linux-x64
          path: apps/jaguar/JaguarCode-linux-x64.tar.gz
      - name: Adjuntar a la publicación
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/jaguar/JaguarCode-linux-x64.tar.gz --clobber
