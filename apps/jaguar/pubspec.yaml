name: jaguar
description: "Jaguar: tu pseudocódigo en cualquier lugar. Compatible con PSeInt."
publish_to: 'none'
version: 0.9.6+28

environment:
  sdk: ^3.9.2

dependencies:
  archive: ^4.5.2
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  jaguar_core:
    git:
      url: https://github.com/panterino/jaguar_core.git
      # v0.1.0 más el arreglo de memoria (tope de texto y de arreglos); sin tag nuevo.
      ref: 91757cf818be83aebdeb221f509bdd56c1a9f29e
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/manual/
    - assets/mascota/
  fonts:
    # Roboto goes inside the app: without it the web asks Google's servers for it
    # on every visit (before the person accepts anything). Apache License 2.0.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# Íconos: dart run flutter_launcher_icons (las fuentes están en assets/icono).
flutter_launcher_icons:
  image_path: assets/icono/icono.png
  android: true
  adaptive_icon_background: "#3B2410"
  adaptive_icon_foreground: assets/icono/icono_android_frente.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icono/icono.png
    background_color: "#3B2410"
    theme_color: "#F4B723"
  macos:
    generate: true
    image_path: assets/icono/icono_macos.png
